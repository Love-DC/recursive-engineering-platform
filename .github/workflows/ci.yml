name: repository-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Repository contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Validate repository contract
        run: python scripts/validate_repo.py

  postgres-prototype:
    name: PostgreSQL 17 Work Registry integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Install PostgreSQL client
        run: |
          # Only refresh Ubuntu's official package indexes. A third-party
          # Microsoft feed has intermittently returned HTTP 403 on hosted
          # runners and should not block PostgreSQL prototype verification.
          ubuntu_sources="$(find /etc/apt/sources.list.d -maxdepth 1 -type f -name 'ubuntu.sources' -print -quit)"
          if [ -z "$ubuntu_sources" ]; then
            echo "Ubuntu official apt source file was not found" >&2
            exit 1
          fi
          sudo apt-get update \
            -o Dir::Etc::sourcelist="$ubuntu_sources" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install --yes postgresql-client

      - name: Run clean-database and concurrency tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: aep_test
        run: python scripts/test_postgres_prototype.py
      - name: Run Stage 2A atomic coordination tests
        run: python scripts/test_stage2a_protocol.py
      - name: Run Stage 2B dependency graph protocol tests
        run: python scripts/test_stage2b_protocol.py
      - name: Run Stage 3 GitHub delivery reconciliation tests
        run: python scripts/test_stage3_delivery_protocol.py
      - name: Run Stage 4A fresh-session recovery tests
        run: python scripts/test_stage4_recovery.py
